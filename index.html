        /* ------------- RANDOMIZE QUESTIONS -------------- */
        function getRandomQuestions(count) {
            const arr = [...allQuestionsSource];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr.slice(0, count);
        }

        let questions = [];
        let currentIndex = 0;
        let userAnswers = {};

        /* ------------- RENDER QUESTION -------------- */
        function renderQuestion() {
            const q = questions[currentIndex];

            let html = `
                <h2 class="text-xl font-semibold text-gray-800 mb-4">
                    ${currentIndex + 1}. ${q.question_text}
                </h2>
                <div class="space-y-3">
            `;

            q.options.forEach(option => {
                const selected = userAnswers[q.question_id] === option.key ? "option-selected" : "";

                html += `
                    <button 
                        onclick="selectOption('${q.question_id}', '${option.key}')"
                        class="option-button w-full text-left px-4 py-3 border rounded-lg bg-gray-50 hover:bg-gray-100 ${selected}">
                        <strong>${option.key.toUpperCase()}.</strong> ${option.text}
                    </button>
                `;
            });

            html += `</div>`;
            document.getElementById("question-content").innerHTML = html;

            updateIndexButtons();
            updateNavigationButtons();
        }

        /* ------------- SELECT OPTION -------------- */
        function selectOption(qid, key) {
            userAnswers[qid] = key;
            renderQuestion();
        }

        /* ------------- NAVIGATION -------------- */
        function handleNavigation(step) {
            currentIndex += step;

            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= questions.length) currentIndex = questions.length - 1;

            renderQuestion();
        }

        /* ------------- UPDATE BUTTONS -------------- */
        function updateNavigationButtons() {
            document.getElementById("prev-btn").disabled = currentIndex === 0;
            document.getElementById("next-btn").disabled = currentIndex === questions.length - 1;

            if (currentIndex === questions.length - 1)
                document.getElementById("finish-btn").classList.remove("hidden");
            else
                document.getElementById("finish-btn").classList.add("hidden");
        }

        /* ------------- INDEX BUTTONS -------------- */
        function updateIndexButtons() {
            const container = document.getElementById("question-index-container");
            container.innerHTML = "";

            questions.forEach((q, i) => {
                const btn = document.createElement("button");

                btn.className =
                    "px-3 py-1 rounded border " +
                    (i === currentIndex
                        ? "bg-indigo-600 text-white"
                        : userAnswers[q.question_id]
                            ? "bg-green-200 text-green-700"
                            : "bg-gray-200 text-gray-700");

                btn.textContent = i + 1;
                btn.onclick = () => { currentIndex = i; renderQuestion(); };

                container.appendChild(btn);
            });
        }

        /* ------------- FINISH QUIZ -------------- */
        function finishQuiz() {
            let score = 0;

            questions.forEach(q => {
                if (userAnswers[q.question_id] === q.correct_answer_key) score++;
            });

            document.getElementById("score-display").textContent = `${score}/${questions.length}`;

            const feedback =
                score === questions.length ? "Perfect!"
                : score >= questions.length * 0.7 ? "Great!"
                : score >= questions.length * 0.5 ? "Good"
                : "Needs Improvement";

            document.getElementById("feedback-message").textContent = feedback;

            renderReview();
            document.getElementById("quiz-view").classList.add("hidden");
            document.getElementById("results-view").classList.remove("hidden");
        }

        /* ------------- REVIEW MODE -------------- */
        function renderReview() {
            const box = document.getElementById("review-list");
            box.innerHTML = "";

            questions.forEach((q, i) => {
                const user = userAnswers[q.question_id];
                const correct = q.correct_answer_key;

                let optionsHtml = "";

                q.options.forEach(op => {
                    let cls = "border p-2 rounded mb-1";

                    if (op.key === correct) cls = "option-correct";
                    else if (op.key === user) cls = "option-incorrect";

                    optionsHtml += `
                        <div class="${cls}"><strong>${op.key.toUpperCase()}.</strong> ${op.text}</div>
                    `;
                });

                box.innerHTML += `
                    <div class="p-4 border rounded-lg">
                        <h4 class="font-semibold mb-2">${i + 1}. ${q.question_text}</h4>
                        ${optionsHtml}
                    </div>
                `;
            });
        }

        /* ------------- INITIALIZE QUIZ -------------- */
        function startQuiz() {
            questions = getRandomQuestions(30);
            renderQuestion();
        }

        startQuiz();
    </script>
</body>
</html>
